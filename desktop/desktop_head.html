<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:">
<title>ウミミ デスクトップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--panel:#f9f9ff;--panel2:#e9ecfd;--ink:#3d3a5c;--ink2:#6c6a94;--peri:#7f8fe0;--peri-deep:#6574cf;--lav:#c7c4f2;--line:#d6daf3;color-scheme:light}
html,body{height:100%;margin:0;background:transparent;overflow:hidden}
body{color:var(--ink);font-family:"Zen Maru Gothic","Yu Gothic UI","Meiryo",sans-serif;font-size:13px;user-select:none}
[hidden]{display:none!important}
.stage{position:fixed;inset:0}
.stage canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit}
.dock{position:absolute;right:10px;bottom:8px;display:flex;gap:3px;align-items:center;background:rgba(249,249,255,.92);border:1.5px solid #fff;border-radius:999px;padding:3px 5px;box-shadow:0 4px 14px rgba(60,60,140,.25);opacity:.6;transition:opacity .2s}
.dock:hover,.dock.open{opacity:1}
.chip{display:inline-flex;align-items:center;gap:4px;border:0;background:none;border-radius:999px;padding:4px 8px;font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:14px;height:14px}
button.chip{cursor:pointer}
button.chip:hover{background:var(--panel2)}
.chip.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.15);background:#fff6d6}}
.chip.party{color:#b0507a}
#diaryBtn,#closetBtn{position:relative}
.album{position:absolute;right:10px;bottom:50px;width:min(720px,calc(100% - 20px));max-height:calc(100% - 58px);overflow:auto;box-sizing:border-box;background:rgba(249,249,255,.97);border:1.5px solid #fff;border-radius:16px;padding:6px 10px 8px;box-shadow:0 4px 14px rgba(60,60,140,.22);user-select:text}
.album h2{margin:0;font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:14px;color:#5b64b8}
.atabs{display:flex;gap:4px;margin:3px 0 5px}
.atab{font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.atab[aria-selected="true"]{background:var(--peri);border-color:var(--peri);color:#fff}
.ugrid{display:flex;gap:5px;overflow-x:auto}
.ucard{flex:0 0 auto;width:92px;display:flex;flex-direction:column;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px 2px 4px;cursor:pointer;color:var(--ink)}
.ucard canvas{width:64px;height:51px}
.ucard .un{font-size:11.5px;font-weight:700}
.ucard .us{font-size:9.5px;color:var(--ink2)}
.ucard.past{background:#f4f4fb;opacity:.85}
.asec{margin:6px 0 3px;font-size:10.5px;color:var(--ink2)}
.adet{display:flex;flex-direction:column;gap:5px}
.aback{align-self:flex-start;font-size:11.5px;border:0;background:none;color:var(--peri-deep);cursor:pointer;padding:0}
.ahead{display:flex;gap:8px;align-items:center}
.ahead canvas{width:90px;height:72px;border-radius:10px;background:linear-gradient(#eef1ff,#e2e6fb)}
.ahead .an{font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:16px;color:#4b4880}
.ahead .ap{font-size:11px;color:var(--ink2);line-height:1.5}
.stats{display:flex;gap:4px;flex-wrap:wrap}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:2px 8px}
.stat .k{font-size:9.5px;color:var(--ink2)}
.stat .v{font-size:13px;font-weight:700}
.stat .v small{font-size:9.5px;font-weight:500;color:var(--ink2)}
.tl{list-style:none;margin:0;padding:0 0 0 10px;border-left:2px dashed var(--lav)}
.tl li{display:grid;grid-template-columns:5.6em 1fr;gap:6px;font-size:11.5px;line-height:1.45;padding:2px 0}
.tl .when{color:var(--ink2);font-size:10.5px}
.pbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.pnote{font-size:10.5px;color:var(--ink2)}
.pgrid{display:flex;gap:5px;overflow-x:auto}
.pgrid button{flex:0 0 auto;width:140px;padding:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;display:flex;flex-direction:column}
.pgrid img{width:100%;height:60px;object-fit:cover;display:block}
.pgrid span{font-size:10px;color:var(--ink2);padding:1px 5px;text-align:left}
.pview img{max-width:100%;max-height:120px;align-self:flex-start;border-radius:10px;border:1.5px solid var(--line)}
.cdown{position:fixed;left:50%;top:55%;transform:translate(-50%,-50%);font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:70px;color:#fff;-webkit-text-stroke:4px #7f8fe0;paint-order:stroke fill;pointer-events:none;animation:cd .9s ease}
@keyframes cd{from{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.shootp{position:absolute;right:10px;bottom:50px;width:min(640px,calc(100% - 20px));max-height:calc(100% - 58px);overflow:auto;box-sizing:border-box;background:rgba(249,249,255,.97);border:1.5px solid #fff;border-radius:16px;padding:6px 10px 8px;box-shadow:0 4px 14px rgba(60,60,140,.22);display:flex;flex-direction:column;gap:4px}
.shootp h2,.studio h2{margin:0;font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:14px;color:#5b64b8}
.sgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lbl2{font-size:10.5px;color:var(--ink2);min-width:3em}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chipb{font-size:11px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:1px 8px;cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--peri);border-color:var(--peri);color:#fff}
.opt{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;cursor:pointer}
.studio{position:absolute;right:10px;bottom:50px;left:10px;height:calc(100% - 58px);max-width:900px;margin-left:auto;box-sizing:border-box;background:rgba(249,249,255,.98);border:1.5px solid #fff;border-radius:16px;padding:6px 10px;box-shadow:0 4px 14px rgba(60,60,140,.22);display:flex;gap:10px;overflow:hidden}
.stL{display:flex;flex-direction:column;gap:2px;min-width:0;height:100%}
.stL canvas{height:calc(100% - 40px);width:auto;max-width:420px;object-fit:contain;border-radius:8px;touch-action:none;cursor:pointer;background:#fff;align-self:flex-start}
.stR{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;overflow:auto}
#stBody{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.fbtn{font-size:11px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:2px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.fbtn[aria-pressed="true"]{border-color:var(--peri);background:var(--panel2)}
.fbtn canvas{width:20px;height:20px}
.stTools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;font-size:11px;color:var(--ink2)}
.stTools input[type=range]{width:100px}
#capIn{font-size:12px;width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:8px;padding:3px 6px;user-select:text}
#studio .lbl{display:block;font-size:10.5px;color:var(--ink2)}
.stAct{margin-top:auto}
.chip.evchip{color:#a0552a}
.eventp{position:absolute;right:10px;bottom:50px;width:min(560px,calc(100% - 20px));max-height:calc(100% - 58px);overflow:auto;box-sizing:border-box;background:rgba(249,249,255,.97);border:1.5px solid #fff;border-radius:16px;padding:6px 10px 8px;box-shadow:0 4px 14px rgba(60,60,140,.22);display:flex;flex-direction:column;gap:4px;user-select:text}
.eventp h2{margin:0;font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:14px;color:#5b64b8}
#evBody{display:flex;gap:6px;flex-wrap:wrap}
.evc{flex:1;min-width:220px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 8px;display:flex;flex-direction:column;gap:3px}
.evc h3{margin:0;font-size:12.5px;color:#4b4880}
.evc p{margin:0;font-size:11px;line-height:1.45;color:var(--ink2)}
.evc input{font-size:12px;border:1.5px solid var(--line);border-radius:8px;padding:2px 6px}
.evc .lbl{display:block;font-size:10.5px;color:var(--ink2)}
.bdrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:4px}
.bdrow select,.bdrow input{font-size:11px;border:1.5px solid var(--line);border-radius:6px;padding:1px 4px}
.bdrow input{width:7em}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;animation:flash .5s ease forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.savep{position:absolute;right:10px;bottom:50px;width:min(640px,calc(100% - 20px));max-height:calc(100% - 58px);overflow:auto;box-sizing:border-box;background:rgba(249,249,255,.97);border:1.5px solid #fff;border-radius:16px;padding:6px 10px 8px;box-shadow:0 4px 14px rgba(60,60,140,.22);user-select:text}
.savep h2{margin:0 0 4px;font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:14px;color:#5b64b8}
.scols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scol{display:flex;flex-direction:column;gap:4px}
.savep textarea{font:11px/1.4 Consolas,monospace;width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;resize:none;word-break:break-all}
.srow{display:flex;gap:4px}
.sbtn{font-size:12px;font-weight:700;border:0;border-radius:999px;padding:4px 10px;cursor:pointer;background:var(--peri);color:#fff}
.sbtn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.sbtn.danger{background:#e98aa8}
.sconfirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin-top:4px;background:#fff4f7;border-radius:10px;padding:4px 8px}
#closetBtn.new::after{content:"";position:absolute;right:2px;top:2px;width:7px;height:7px;border-radius:50%;background:#f08aa8}
.closet{position:absolute;right:10px;bottom:50px;max-width:calc(100% - 20px);max-height:calc(100% - 58px);box-sizing:border-box;background:rgba(249,249,255,.96);border:1.5px solid #fff;border-radius:16px;padding:6px 10px 8px;box-shadow:0 4px 14px rgba(60,60,140,.22);display:flex;flex-direction:column}
.closet h2{margin:0;font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:14px;color:#5b64b8}
.csub{margin:0 0 4px;font-size:11px;color:var(--ink2)}
.ogrid{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.oitem{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:0;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px 2px 4px;cursor:pointer;color:var(--ink)}
.oitem canvas{width:56px;height:45px}
.oitem .onm{font-size:11px;font-weight:700}
.oitem .ost{font-size:9.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:2px;text-align:center;line-height:1.25}
.oitem .ost svg{width:9px;height:9px}
.oitem .ost.buy{color:#a8872c;font-weight:700}
.oitem.locked{background:#f4f4fb}
.oitem[aria-pressed="true"]{border-color:var(--peri);background:var(--panel2)}
.olab{font-size:11.5px;color:var(--ink);align-self:center}
#diaryBtn.new::after{content:"";position:absolute;right:2px;top:2px;width:7px;height:7px;border-radius:50%;background:#f08aa8}
.weather{font-weight:500;color:var(--ink2)}
.weather .wl{display:none}
.weather b{font-weight:500}
.tool{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer;padding:0}
.tool svg{width:18px;height:18px}
.tool span{display:none}
.tool:hover{background:var(--panel2)}
.tool[aria-pressed="true"]{background:var(--peri);color:#fff}
.sep{width:1px;height:18px;background:var(--line);margin:0 2px}
.tray{position:absolute;right:10px;bottom:50px;max-width:calc(100% - 20px);display:flex;gap:6px;overflow-x:auto;background:rgba(249,249,255,.95);border:1.5px solid #fff;border-radius:16px;padding:6px;box-shadow:0 4px 14px rgba(60,60,140,.22);box-sizing:border-box}
.tray:empty{display:none}
.item{flex:0 0 auto;width:70px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:4px 2px;cursor:pointer}
.item canvas{width:52px;height:42px}
.item .cost{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:#a8872c}
.item .cost svg{width:10px;height:10px}
.item[aria-pressed="true"]{border-color:var(--peri);background:var(--panel2)}
.item:disabled{opacity:.45;cursor:default}
.item.put{justify-content:center}
.count{flex:0 0 auto;align-self:center;font-size:12px;color:var(--ink2);padding-inline:4px}
.card{position:absolute;left:10px;bottom:8px;display:flex;gap:8px;align-items:center;width:300px;max-height:calc(100% - 16px);overflow:auto;box-sizing:border-box;background:rgba(249,249,255,.95);border:1.5px solid #fff;border-radius:16px;padding:8px 10px;box-shadow:0 4px 14px rgba(60,60,140,.22)}
.card #cardPic{width:84px;height:67px;flex:0 0 auto;border-radius:10px;background:linear-gradient(#eef1ff,#e2e6fb)}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lbl{display:none}
.cinfo input{font:inherit;font-size:14px;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:2px 6px;background:#fff;width:calc(100% - 22px);box-sizing:border-box;user-select:text}
.meta{font-size:12px;color:var(--ink2)}
.hearts{display:flex;gap:2px;align-items:center;font-size:11px;color:var(--ink2)}
.hearts svg{width:12px;height:12px}
.hearts .on path{fill:#f39bb5}
.hearts .off path{fill:#dcdcef}
.accs{display:flex;gap:3px;flex-wrap:wrap}
.acc{font-size:11px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:1px 7px;cursor:pointer;color:var(--ink)}
.acc[aria-pressed="true"]{background:var(--peri);color:#fff;border-color:var(--peri)}
.acc:disabled{opacity:.5;cursor:default}
.bye{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--ink2)}
.bye button{font-size:11px;border-radius:999px;padding:1px 8px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink2)}
.bye button.danger{border-color:#eeb0c4;color:#b0507a}
.bye button.danger.solid{background:#e98aa8;border-color:#e98aa8;color:#fff}
.x{position:absolute;right:4px;top:2px;border:0;background:none;font-size:17px;line-height:1;color:var(--ink2);cursor:pointer;padding:2px 5px;border-radius:6px}
.diary{position:absolute;right:10px;bottom:50px;width:320px;max-height:calc(100% - 58px);overflow:auto;box-sizing:border-box;background:rgba(249,249,255,.96);border:1.5px solid #fff;border-radius:16px;padding:8px 12px;box-shadow:0 4px 14px rgba(60,60,140,.22);user-select:text}
.diary h2{margin:0 0 2px;font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:15px;color:#5b64b8}
.diary ol{list-style:none;margin:0;padding:0}
.diary li{display:grid;grid-template-columns:5.2em 1fr;gap:6px;font-size:12px;line-height:1.5;padding:4px 0;border-top:1px dashed var(--line)}
.diary .when{color:var(--ink2);font-size:11px;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:rgba(61,58,92,.86);color:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;white-space:nowrap;pointer-events:none;animation:toastIn .35s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}}
.bday{position:absolute;left:50%;bottom:8px;transform:translateX(-50%)}
.bday .inner{display:flex;align-items:center;gap:14px;background:linear-gradient(170deg,#fffafc,#f1f0ff);border:2px solid #fff;border-radius:18px;padding:10px 16px;box-shadow:0 8px 24px rgba(70,60,160,.3);white-space:nowrap}
.bday .hb{font-family:"Klee One","Zen Maru Gothic",serif;font-weight:600;font-size:24px;margin:0;background:linear-gradient(90deg,#e889ad,#8f8fe6,#6cc1a2,#e3b653);-webkit-background-clip:text;background-clip:text;color:transparent}
.bday .jp{font-family:"Klee One","Zen Maru Gothic",serif;font-size:14px;color:#5b64b8}
.bday .jp br,.bday .msg,.bday .tip{display:none}
.bday .go{font-weight:700;font-size:13px;color:#fff;background:linear-gradient(90deg,#ee93b3,#8f97e6);border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--peri-deep);outline-offset:2px}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="cv"></canvas>

  <div class="card ui" id="card" hidden>
    <button class="x" id="cardClose" type="button" aria-label="とじる">×</button>
    <canvas id="cardPic"></canvas>
    <div class="cinfo">
      <label for="nameIn" class="lbl">なまえ</label>
      <input id="nameIn" maxlength="8" autocomplete="off">
      <div class="meta"><span id="cColor"></span>・<span id="cMood"></span></div>
      <div class="hearts" id="cHearts"></div>
      <div class="accs" id="cAccs" role="group" aria-label="きせかえ"></div>
      <div class="bye" id="cBye"></div>
    </div>
  </div>

  <section class="closet ui" id="closet" hidden aria-labelledby="closetTitle">
    <button class="x" id="closetClose" type="button" aria-label="とじる">×</button>
    <h2 id="closetTitle">おきがえコレクション</h2>
    <p class="csub" id="closetSub"></p>
    <div class="ogrid" id="closetList"></div>
  </section>
  <section class="album ui" id="album" hidden aria-labelledby="albumTitle">
    <button class="x" id="albumClose" type="button" aria-label="とじる">×</button>
    <h2 id="albumTitle">ウミミアルバム</h2>
    <div class="atabs" role="tablist"><button class="atab" id="tabU" type="button" role="tab" aria-selected="true">ウミミたち</button><button class="atab" id="tabP" type="button" role="tab" aria-selected="false">しゃしん</button></div>
    <div id="albumBody"></div>
  </section>
  <div class="flash" id="flash" hidden></div>
  <section class="eventp ui" id="eventp" hidden aria-labelledby="evTitle">
    <button class="x" id="evClose" type="button" aria-label="とじる">×</button>
    <h2 id="evTitle">いまの イベント</h2>
    <div id="evBody"></div>
  </section>
  <div class="cdown" id="cdown" hidden></div>
  <section class="shootp ui" id="shootp" hidden aria-labelledby="shootTitle">
    <button class="x" id="shootClose" type="button" aria-label="とじる">×</button>
    <h2 id="shootTitle">しゃしんを とる</h2>
    <div class="sgrp"><span class="lbl2">写る子</span><div class="chips" id="shootWho"></div></div>
    <div class="sgrp"><span class="lbl2">ピント</span><div class="chips" id="shootFocus"></div></div>
    <div class="sgrp opts">
      <label class="opt" for="optGather"><input type="checkbox" id="optGather" checked> 真ん中に あつまる</label>
      <label class="opt" for="optCount"><input type="checkbox" id="optCount" checked> カウントダウン</label>
      <label class="opt" for="optSmile"><input type="checkbox" id="optSmile" checked> にっこりポーズ</label>
      <button class="sbtn" id="shootGo" type="button">とる</button><button class="sbtn ghost" id="shootCancel" type="button">やめる</button>
    </div>
  </section>
  <section class="studio ui" id="studio" hidden aria-labelledby="studioTitle">
    <div class="stL"><h2 id="studioTitle">しゃしんを かざる</h2><canvas id="studioCv"></canvas><p class="pnote" id="stHint">スタンプは ドラッグで うごかせます</p></div>
    <div class="stR">
      <div class="atabs" role="tablist"><button class="atab" type="button" data-st="filter" aria-selected="true">フィルター</button><button class="atab" type="button" data-st="frame" aria-selected="false">フレーム</button><button class="atab" type="button" data-st="stamp" aria-selected="false">スタンプ</button><button class="atab" type="button" data-st="cap" aria-selected="false">ひとこと</button></div>
      <div id="stBody"></div>
      <div class="srow stAct"><button class="sbtn" id="stSave" type="button">アルバムに入れる</button><button class="sbtn ghost" id="stRetake" type="button">とりなおす</button><button class="sbtn ghost" id="stDiscard" type="button">すてる</button></div>
    </div>
  </section>
